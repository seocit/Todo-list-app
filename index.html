<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		
		<link rel="stylesheet" href="src/style.css" />
		<title>ToDo List</title>
	</head>
	<body>
		<header class="w-full bg-gray-800 text-white">
			<nav class="flex items-center justify-between px-4 py-4 sm:px-8 md:px-20">
				<span class="text-xl font-bold">TODO-LIST</span>
				<div class="flex items-center space-x-4">
					<p>Jane Doe</p>
					<p>--  PM --</p>
					<img class="w-10 h-10 rounded-full object-cover" src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="profile-image">
				</div>

			</nav>
		</header>

		<main class="flex flex-col px-4 bg-gray-100 min-h-screen items-center justify-center gap-4 sm:px-8 md:px-20 lg:px-40" >
			<div id="input-form" action="" class="flex w-full flex-col bg-white rounded-lg gap-2 mt-4 border border-gray-300 p-2 sm:flex-row sm:items-center sm:gap-4">
				<input id="inputList" placeholder="input your task here..." type="text" class="min-w-0 flex-1 px-4 py-2">
				<select name="priority" id="priorityOption" class="">
					<option value="Low">Low</option> 
					<option value="Medium">Medium</option> 
					<option value="High">High</option> 
				</select>
				<input id="dateInput" type="date"> 
				<button onclick="submitInput()" class="text-white bg-slate-800 rounded-lg py-2 px-4 sm:h-full">Submit</button>
			</div>
			<div class="flex flex-col items-center min-h-screen gap-4 w-full ">
				<div class="flex flex-col bg-white w-full p-4 sm:p-6 gap-4 border border-gray-200 shadow-xl rounded-lg">
					<div class="flex justify-between">
						<h2 class="text-xl font-bold">To-Do List</h2>
					<button class="text-white bg-red-500 py-1 px-3 rounded-xl" onclick="deleteAllTask()">Delete All</button>
					</div>
					<div class="w-full overflow-x-auto">
					<table class="w-full border-collapse">
						<thead class="hidden sm:table-header-group">
							<tr class="">
								<th class="w-1/2 pb-4">Task</th>
								<th class="pb-4">Priority</th>
								<th class="pb-4">Due date</th>
								<th class="pb-4">Action</th>
							</tr>
						</thead>
						<tbody id="taskList">
							<tr>
								<td class="px-2 mt-3">Task 1</td>
								<td class="px-2">low</td>
								<td class="px-2">task 1</td>
								<td class="px-2 text-center"> <button class="text-white bg-red-500 py-1 px-4 rounded-xl">delete</button></td>
							</tr>
						</tbody>
					</table>
					</div>
				</div>

				<div class="flex flex-col bg-white w-full p-4 gap-4 border border-gray-200 shadow-xl rounded-lg">
					<div class="flex justify-between">
						<h2 class="text-xl font-bold">Done List</h2>
						<button onclick="deleteAllCompleteTask()" class="text-white bg-red-500 py-1 px-3 rounded-xl">Delete All</button>
					</div>
					<div class="w-full overflow-x-auto">
					<table class="w-full border-collapse">
						<thead class="hidden sm:table-header-group">
							<tr class="">
								<th class="w-1/2 pb-4">Task</th>
								<th class="pb-4">Priority</th>
								<th class="pb-4">Due date</th>
								<th class="pb-4">Action</th>
							</tr>
						</thead>
						<tbody id="doneList">
							<tr>
								<td colspan="4" class="text-gray-400 text-center py-2">No Task</td>
							</tr>
						</tbody>
					</table>
					</div>	
				</div>
			</div>
		</main>
		<script src="src/main.js"></script>
	</body>
</html>
